apiVersion: v1
kind: ConfigMap
metadata:
  name: singbox-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "free.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "log": { "level": "warn" },
      "inbounds": [
        {
          "type": "trojan",
          "tag": "trojan-in",
          "listen": "::",
          "listen_port": 8443,
          "users": [ { "name": "me", "password": "password2" } ],
          "tls": {
            "enabled": true,
            "certificate_path": "/etc/tls/tls.crt",
            "key_path": "/etc/tls/tls.key",
            "alpn": ["http/1.1", "h2"]
          },
          "fallback": { "server": "dummy-page.default.svc.cluster.local", "server_port": 80 }
        }
      ],
      "outbounds": [ { "type": "direct", "tag": "direct" } ],
      "route": { "final": "direct" }
    }
