# HelmChartConfig for the Traefik instance bundled with k3s.
#
# Install on the k3s SERVER node at:
#   /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
#
# Merge order note (decision locked 2026-11-25): apply AFTER k3s reaches
# v1.37.2, NOT before. Applying it earlier re-runs k3s's old bundled-chart job
# (chart 34.2.1 on k3s 1.32) and downgrades the release for no benefit; the
# existing mail-ports HelmChartConfig keeps mail working in the meantime.
# This manifest supersedes that mail-only config (it carries the same ports).
#
# Cloudflare trusted IPs below are hardcoded (HelmChartConfig is static, no
# templating). Refresh periodically from:
#   https://www.cloudflare.com/ips-v4
#   https://www.cloudflare.com/ips-v6
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi

    priorityClassName: system-cluster-critical

    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule

    # Optional: pin a newer Traefik than the one bundled with k3s (e.g. 3.7.19).
    # image:
    #   tag: "3.7.19"

    # DEBUG access logging is verbose; consider dropping or lowering these in prod.
    additionalArguments:
      - "--log.level=DEBUG"
      - "--accesslog=true"

    metrics:
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: "1m"
        service:
          enabled: true

    # Mail ports. IngressRouteTCP binds proxy ports internally (and sends PROXY v2
    # to the mailserver). Do NOT set `proxyProtocol.trustedIPs` on these entrypoints:
    # it makes Traefik wait for an inbound PROXY header from every client, which
    # blocks server-first protocols (SMTP/IMAP/POP3 banner never arrives). Nothing
    # in front of Traefik sends PROXY (k3s klipper-lb does not).
    ports:
      mail-smtp:
        port: 25
        expose:
          default: true
        exposedPort: 25
        protocol: TCP
      mail-sb:
        port: 587
        expose:
          default: true
        exposedPort: 587
        protocol: TCP
      mail-sbs:
        port: 465
        expose:
          default: true
        exposedPort: 465
        protocol: TCP
      mail-imap:
        port: 143
        expose:
          default: true
        exposedPort: 143
        protocol: TCP
      mail-imaps:
        port: 993
        expose:
          default: true
        exposedPort: 993
        protocol: TCP
      mail-pop3:
        port: 110
        expose:
          default: true
        exposedPort: 110
        protocol: TCP
      mail-pop3s:
        port: 995
        expose:
          default: true
        exposedPort: 995
        protocol: TCP

      # Cloudflare edge IPs allowed to set forwarded headers (refresh periodically).
      # Must live under `ports:` (chart schema: ports.<entrypoint>.forwardedHeaders).
      #
      # asDefault: with no entrypoint marked default, Traefik treats ALL entrypoints
      # (including the mail ones) as defaults, so HTTPS Ingresses attach to them and
      # Traefik must peek client bytes before connecting upstream. That stalls
      # server-first protocols (SMTP 25/587, IMAP 143, POP3 110: no banner until the
      # client speaks). Only web/websecure may be default entrypoints.
      web:
        asDefault: true
        forwardedHeaders:
          trustedIPs:
            - 173.245.48.0/20
            - 103.21.244.0/22
            - 103.22.200.0/22
            - 103.31.4.0/22
            - 141.101.64.0/18
            - 108.162.192.0/18
            - 190.93.240.0/20
            - 188.114.96.0/20
            - 197.234.240.0/22
            - 198.41.128.0/17
            - 162.158.0.0/15
            - 104.16.0.0/13
            - 104.24.0.0/14
            - 172.64.0.0/13
            - 131.0.72.0/22
            - 2400:cb00::/32
            - 2606:4700::/32
            - 2803:f800::/32
            - 2405:b500::/32
            - 2405:8100::/32
            - 2a06:98c0::/29
            - 2c0f:f248::/32
      websecure:
        asDefault: true
        forwardedHeaders:
          trustedIPs:
            - 173.245.48.0/20
            - 103.21.244.0/22
            - 103.22.200.0/22
            - 103.31.4.0/22
            - 141.101.64.0/18
            - 108.162.192.0/18
            - 190.93.240.0/20
            - 188.114.96.0/20
            - 197.234.240.0/22
            - 198.41.128.0/17
            - 162.158.0.0/15
            - 104.16.0.0/13
            - 104.24.0.0/14
            - 172.64.0.0/13
            - 131.0.72.0/22
            - 2400:cb00::/32
            - 2606:4700::/32
            - 2803:f800::/32
            - 2405:b500::/32
            - 2405:8100::/32
            - 2a06:98c0::/29
            - 2c0f:f248::/32

    ingressClass:
      enabled: true
      isDefaultClass: true
      name: traefik

    experimental:
      plugins:
        blockpath:
          moduleName: github.com/traefik/plugin-blockpath
          version: v0.2.1
